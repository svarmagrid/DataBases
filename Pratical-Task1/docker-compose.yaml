services:
  database:
    image: postgres:15
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${DB_PORT}:${DB_CONTAINER_PORT}"

    volumes:
      - ${DB_VOLUME}:/var/lib/postgresql/data

volumes:
  postgres_data: